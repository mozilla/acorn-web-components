<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Installed as /etc/fonts/local.conf by `npm run test:visual:fonts`.

  The font stack in base.css hits `system-ui` first, which in the Playwright
  image resolves to WenQuanYi Zen Hei: one Regular face, and base.css sets
  `font-synthesis: none`, so every bold weight flattens to regular. Roboto is
  further down that stack but never reached, and Debian's own sans preferences
  do not mention it, so point the generics at it here.

  No double hyphens in this comment: they are illegal in XML and make
  fontconfig discard the whole file, reporting it only on stderr.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
</fontconfig>
