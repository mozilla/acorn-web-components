# Publishes the built library to the public npm registry.
#
# Trigger it by publishing a GitHub Release whose tag is the version, or
# manually (Actions → Publish → Run workflow, giving a version). A version with
# a prerelease identifier (1.1.0-beta.1) goes out under that identifier's
# dist-tag; a plain version (1.0.0) goes out as `latest`.
#
# Auth is npm trusted publishing (OIDC), so there is no NPM_TOKEN: npmjs.com is
# configured to trust this repository and this workflow *filename*, which is
# why renaming this file means updating the trusted publisher config too.
# Trusted publishing also generates provenance attestations on its own, so no
# --provenance flag here.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.0.0 or 1.1.0-beta.1"
        required: true

concurrency:
  group: publish
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not the shared composite: publishing needs registry-url, which writes
      # the npmrc that points npm at the public registry.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1+; the bundled npm is newer than that
      # on current Node 24, but pin the floor so a runner image rolling back
      # fails here with a clear message instead of at `npm publish`.
      - name: Check npm supports trusted publishing
        run: |
          npm_version=$(npm --version)
          echo "npm $npm_version"
          if [ "$(printf '%s\n11.5.1\n' "$npm_version" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm $npm_version is too old for trusted publishing (need 11.5.1+)." >&2
            exit 1
          fi
      - run: npm ci
      # Bun powers the copy-assets step inside `npm run build`.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - run: npm run build
      # Stamp the release/input version into package.json for this run only (not
      # committed). --allow-same-version only avoids a local error when re-stamping
      # the same version; it does not make publish reruns safe (the registry
      # rejects an already-published version).
      - name: Set version
        env:
          VERSION: ${{ github.event.inputs.version || github.event.release.tag_name }}
        run: npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
      # A prerelease must not land on `latest`, or a plain `npm install` would
      # start serving it. Derive the tag from the identifier instead.
      - name: Choose the dist-tag
        id: tag
        env:
          VERSION: ${{ github.event.inputs.version || github.event.release.tag_name }}
        run: |
          version="${VERSION#v}"
          case "$version" in
            *-*) tag="${version#*-}"; tag="${tag%%.*}" ;;
            *)   tag="latest" ;;
          esac
          echo "Publishing $version under dist-tag '$tag'"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # dist is already built above, so skip the prepack/prepare rebuild.
      - name: Publish
        run: npm publish --ignore-scripts --tag "${{ steps.tag.outputs.tag }}"
