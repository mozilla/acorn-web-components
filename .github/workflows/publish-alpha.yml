# Publishes the built library to GitHub Packages (npm registry) while acorn is in
# alpha. Consumers install it as a scoped registry dependency
# (`@mozilla/acorn-web-components`).
#
# Trigger it manually (Actions → Publish alpha → Run workflow, giving a version)
# or by publishing a GitHub Release whose tag is the version. Versions are
# published under the `alpha` dist-tag so `@mozilla/acorn-web-components@alpha`
# tracks the latest alpha and `latest` is never pinned to a prerelease.
name: Publish alpha

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.0.0-alpha.1'
        required: true

concurrency:
  group: publish-alpha
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require a prerelease version
        env:
          VERSION: ${{ github.event.inputs.version || github.event.release.tag_name }}
        run: |
          if [[ "${VERSION#v}" != *-* ]]; then
            echo "::error::publish-alpha publishes prereleases only (need a '-' identifier, e.g. 0.0.0-alpha.1); got '${VERSION#v}'." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not the shared composite: publishing needs the registry + scope wired
      # into the npmrc so `npm publish` authenticates to GitHub Packages.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: '@mozilla'
      - run: npm ci
      # Bun powers the copy-assets step inside `npm run build`.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - run: npm run build
      # Stamp the release/input version into package.json for this run only (not
      # committed). --allow-same-version only avoids a local error when re-stamping
      # the same version; it does not make publish reruns safe (the registry
      # rejects an already-published version).
      - name: Set version
        env:
          VERSION: ${{ github.event.inputs.version || github.event.release.tag_name }}
        run: npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
      # dist is already built above, so skip the prepack/prepare rebuild.
      - name: Publish
        run: npm publish --ignore-scripts --tag alpha
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
