# Nightly upstream sync: refresh the vendored Firefox tokens + icons from
# github.com/mozilla-firefox/firefox (the source this repo references),
# regenerate, and open a PR to review. Drift is handled here (and via
# `npm run vendor` on demand), NOT in the standard CI pipeline.
#
# The PR is opened with git + the gh CLI rather than a third-party action, since
# the Mozilla org restricts workflows to GitHub-owned / allowlisted actions.

name: Upstream sync

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Full history so pushing the sync branch can't hit a shallow-update error.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - run: npm ci

      # Sparse, shallow checkout of only the two Firefox source dirs we vendor,
      # from the same repo the local checkout tracks.
      - name: Fetch Firefox sources
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/mozilla-firefox/firefox.git /tmp/firefox
          git -C /tmp/firefox sparse-checkout set \
            toolkit/themes/shared/design-system/src/tokens \
            toolkit/themes/shared/icons

      # Same vendor script used locally, pointed at the sparse checkout, then
      # regenerate. `npm run vendor` records /tmp/firefox's revision in VENDOR.json.
      - name: Vendor + regenerate
        run: |
          FIREFOX_PATH=/tmp/firefox npm run vendor
          npm run generate

      # Open (or update) a PR only if the vendored sources or generated output
      # changed. Uses git + the runner's gh CLI rather than a third-party action:
      # the Mozilla org allowlist blocks non-GitHub actions (e.g. peter-evans/
      # create-pull-request).
      - name: Open PR on change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add vendor/design-system vendor/icons src/generated
          if git diff --cached --quiet; then
            echo "No token/icon changes; nothing to sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/upstream-sync
          git commit -m "chore: sync design tokens and icons from Firefox"
          git push --force origin chore/upstream-sync
          if [ -z "$(gh pr list --head chore/upstream-sync --state open --json number --jq '.[].number')" ]; then
            gh pr create --head chore/upstream-sync \
              --title "chore: sync design tokens and icons from Firefox" \
              --body "Automated nightly sync of the vendored Firefox tokens and icons, with regenerated output. Review the diffs, check Storybook, and let tests run before merging."
          else
            echo "PR already open for chore/upstream-sync; pushed the update."
          fi

      # TODO: detecting drift in Firefox's hand-authored moz-* COMPONENT source
      # (for parity with our components) is a separate, notify-only concern that
      # should open an issue, not a PR. Not implemented: this repo vendors only
      # tokens and icons.
