# CI for acorn-web-components (Lit web-components library).
#
# Split into independent, parallel jobs so a red check names itself in the PR
# checks list (lint / typecheck / build / test / visual) instead of hiding one
# failure inside a long serial run. Jobs share setup via .github/actions/setup.

name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded runs on the same branch/PR (a new push voids the old run).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Separate steps so Biome and Stylelint report independently.
      - name: Biome
        run: npm run lint:js
      - name: Stylelint
        run: npm run lint:css

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Bun powers the clean/copy-assets steps inside `npm run build`.
      - uses: oven-sh/setup-bun@v2
      - run: npm run build

  # Runs in the pinned Playwright container: the browsers and their system deps
  # are baked into the image, so there's no per-run `playwright install`, apt
  # step, or browser download. Bump the image tag deliberately, in step with the
  # `playwright` dependency (and the `visual` job below) — a ~monthly update
  # rather than churn on every run.
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    # The container runs as root, but the image's default $HOME is owned by
    # pwuser, and Firefox won't launch as root in another user's home. Point
    # HOME at root's own home (per Playwright's own guidance).
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Each engine runs once: Chromium via the coverage pass (v8 only
      # instruments Chromium), Firefox + WebKit via a separate cross-browser
      # pass. All three ship in the image.
      - name: Coverage (Chromium)
        run: npm run test:coverage
      - name: Cross-browser (Firefox + WebKit)
        run: npm run test:browsers -- --project=firefox --project=webkit

  # Pixel snapshots run in the same pinned Playwright container so the browser
  # build and fonts match the committed `-chromium-linux` baselines exactly.
  # Keep this image tag in sync with the `test` job's.
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    # Chromium-only today so it doesn't strictly need this, but keep it in step
    # with `test` so adding a Firefox snapshot later can't regress (see above).
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Visual snapshots (Chromium)
        run: npm run test:visual
      # On a mismatch, publish the browsable HTML report (reference vs actual per
      # snapshot). Download the artifact and open index.html.
      - name: Upload visual report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: visual-report
          if-no-files-found: ignore
      - name: Note the report in the run summary
        if: failure()
        run: |
          echo "### 📸 Visual differences detected" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the **visual-report** artifact above and open \`index.html\` to compare reference vs actual." >> "$GITHUB_STEP_SUMMARY"
