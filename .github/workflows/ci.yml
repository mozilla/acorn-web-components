# CI for acorn-web-components (Lit web-components library).
#
# Split into independent, parallel jobs so a red check names itself in the PR
# checks list (lint / typecheck / build / test / visual) instead of hiding one
# failure inside a long serial run. Jobs share setup via .github/actions/setup.
#
# Keep the workflow name "CI": the deploy workflow gates on it via workflow_run.

name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded runs on the same branch/PR (a new push voids the old run).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Separate steps so Biome and Stylelint report independently.
      - name: Biome
        run: npm run lint:js
      - name: Stylelint
        run: npm run lint:css

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Bun powers the clean/copy-assets steps inside `npm run build`.
      - uses: oven-sh/setup-bun@v2
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # test:browsers exercises Chromium + Firefox; coverage is Chromium-only
      # (v8 provider), so both browsers must be present.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Test (Chromium + Firefox)
        run: npm run test:browsers
      - name: Coverage
        run: npm run test:coverage

  # Pixel snapshots run in the pinned Playwright container so the browser build
  # and fonts match the committed `-chromium-linux` baselines exactly. Browsers
  # ship in the image, so no `playwright install` step is needed.
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Visual snapshots (Chromium)
        run: npm run test:visual
      # On a mismatch, publish the actual/diff images for inspection.
      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: |
            tests/visual/**/*-actual.png
            tests/visual/**/*-diff.png
          if-no-files-found: ignore
