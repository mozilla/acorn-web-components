# Auto-deploy this repo to Quick on merge to main. Generated by 'quick gha'.
# Requires the org-level GitHub Actions variable GCPV2_GITHUB_WORKLOAD_IDENTITY_PROVIDER
# (present in most Mozilla GitHub orgs; file a Bugzilla bug to add it if missing).
#
# Deploy target: PROD by default. To deploy to the nonprod Quick instead, set a
# repository (or org) Actions variable QUICK_ENV=stage — nothing env-specific is
# baked into this file, so the same workflow serves both.
#
# Site name is resolved per run: the "site" workflow input, else a QUICK_SITE
# Actions variable (repo or org), else the default below. Keeping the default as
# the repo name makes this file generic - it works unmodified in any repo.
name: Deploy to Quick
on:
  # Deploy only after the CI workflow finishes on main. The job's `if` guard
  # then requires a *successful* CI run, so a red build never deploys.
  # (workflow_run reads this trigger from the default-branch copy of the file.)
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      site:
        description: "Site name to deploy to (default: the repo name)"
        type: string
        default: ""
      force:
        description: Overwrite even if the site was last deployed by someone else
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Gate on CI: run for a manual dispatch, or when the triggering CI run passed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      # Storybook's static build output; deploy this, not the repo root.
      DIR: storybook-static
      QUICK_DEPLOYED_BY: github:${{ github.repository }}
      # Quick project: nonprod only when the QUICK_ENV variable is 'stage'; prod otherwise.
      QUICK_PROJECT: ${{ vars.QUICK_ENV == 'stage' && 'moz-fx-quick-nonprod' || 'moz-fx-quick-prod' }}
    steps:
      # Deploy exactly the commit CI validated (head_sha); falls back to the
      # dispatch ref for manual runs.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      # Build the static Storybook that gets deployed. Node 24 with npm caching,
      # matching ci.yml. The token/icon files under src/generated are committed,
      # so no Bun/generate step is needed here.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCPV2_GITHUB_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: quick-gha-deploy@${{ env.QUICK_PROJECT }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Quick
        env:
          SITE: ${{ inputs.site || vars.QUICK_SITE || github.event.repository.name }}
        run: |
          gcloud storage cp "gs://${QUICK_PROJECT}-cli/quick-linux-amd64" "$RUNNER_TEMP/quick"
          chmod +x "$RUNNER_TEMP/quick"
          "$RUNNER_TEMP/quick" deploy "$DIR" "$SITE" --mirror ${{ inputs.force && '--yes' || '' }}
